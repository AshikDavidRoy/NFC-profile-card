<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f5fb">
  <title>Profile Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=DM+Sans:400,500|Jost:400,500,600,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: clamp(12px, 4vw, 20px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2b2c48;
      font-family: "Jost", sans-serif;
      background-color: #25283c;
      background-image: url("https://i.pinimg.com/originals/c8/b2/e0/c8b2e0b466dabc9d18a152751abc5744.gif");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      --card-height: 450px;
      width: min(100%, 340px);
      min-width: 0;
      height: min(var(--card-height), calc(100vh - 32px));
      height: min(var(--card-height), calc(100dvh - 32px));
      min-height: min(360px, calc(100vh - 32px));
      min-height: min(360px, calc(100dvh - 32px));
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      margin: auto;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 10px;
      background-color: #fff;
      box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.2);
      transition: height 0.3s ease;
    }

    .card[data-state="#experience"] {
      --card-height: 550px;
    }

    .card-header {
      position: relative;
      display: flex;
      flex: 0 0 200px;
      width: 100%;
      height: 200px;
      min-width: 0;
      transition: height 0.3s ease, flex-basis 0.3s ease;
    }

    .card-cover {
      position: absolute;
      top: -20%;
      left: 0;
      width: 100%;
      height: 160px;
      background-size: cover;
      background-position: center;
      filter: blur(30px);
      transform: scale(1.2);
      transition: top 0.5s ease, height 0.5s ease;
      will-change: top;
    }

    .card-avatar {
      position: absolute;
      bottom: 70px;
      left: 50%;
      width: 90px;
      height: 90px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      object-position: center;
      object-fit: cover;
      transform: translateX(-50%);
      box-shadow: 0 8px 8px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .card-fullname {
      position: absolute;
      right: 12px;
      bottom: 22px;
      left: 12px;
      max-height: 2.4em;
      margin: 0;
      overflow: hidden;
      font-size: clamp(16px, 5vw, 22px);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      transition: all 0.3s ease;
    }

    .card-jobtitle {
      position: absolute;
      right: 12px;
      bottom: 5px;
      left: 12px;
      max-height: 1.3em;
      margin: 0;
      overflow: hidden;
      font-size: clamp(10px, 3vw, 11px);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    /* Compact header shown for Experience and Contact. */
    .card.is-active .card-header {
      flex-basis: 80px;
      height: 80px;
    }

    .card.is-active .card-cover {
      top: -50px;
      height: 100px;
    }

    .card.is-active .card-avatar {
      bottom: 15px;
      left: 16px;
      width: 50px;
      height: 50px;
      transform: none;
    }

    .card.is-active .card-fullname {
      right: 10px;
      bottom: 31px;
      left: 78px;
      max-height: 2.2em;
      font-size: clamp(14px, 4vw, 19px);
      line-height: 1.1;
      text-align: left;
    }

    .card.is-active .card-jobtitle {
      right: 10px;
      bottom: 9px;
      left: 78px;
      max-height: 1.2em;
      font-size: clamp(9px, 2.8vw, 10px);
      line-height: 1.2;
      letter-spacing: 0.8px;
      text-align: left;
    }

    .card-main {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding-top: 10px;
      overflow: hidden;
    }

    .card[data-state="#about"] .card-main {
      padding-top: 0;
    }

    .card-section {
      display: none;
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .card-section.is-active {
      display: block;
      flex: 1 1 auto;
      animation: fadeIn 0.35s ease both;
    }

    .card-content {
      min-width: 0;
      padding: 20px;
    }

    .card-subtitle {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .card-desc {
      margin: 0;
      color: #636b6f;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(12px, 3.5vw, 14px);
      font-weight: 400;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .card-social {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 0 20px;
    }

    .card-social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: #8797a1;
      text-decoration: none;
      background-color: rgba(93, 133, 193, 0.05);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .card-social a i {
      display: block;
      color: #a5b5ce;
      font-size: 16px;
      transition: color 0.2s ease;
    }

    .card-social a:hover,
    .card-social a:focus-visible {
      color: #2b2c48;
      background-color: rgba(93, 133, 193, 0.12);
    }

    .card-social a:hover i,
    .card-social a:focus-visible i {
      color: #8490a4;
    }

    .card-timeline {
      position: relative;
      margin-top: 24px;
    }

    .card-timeline::after {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 40px;
      width: 2px;
      background: linear-gradient(to top,
          rgba(134, 214, 243, 0) 0%,
          rgba(81, 106, 204, 1) 100%);
      content: "";
      pointer-events: none;
    }

    .card-item {
      position: relative;
      z-index: 1;
      padding: 0 16px 26px 58px;
    }

    .card-item:last-child {
      padding-bottom: 5px;
    }

    .card-item::after {
      position: absolute;
      top: 2px;
      left: 35px;
      width: 8px;
      height: 8px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: linear-gradient(to bottom, #5f79d2 0%, #516acc 100%);
      content: "";
    }

    .card-item-year {
      position: absolute;
      top: 0;
      left: 0;
      width: 29px;
      color: rgba(110, 110, 125, 0.8);
      font-size: 10px;
      line-height: 1.3;
      text-align: right;
    }

    .card-item-title {
      margin: 0 0 5px;
      font-size: clamp(12px, 3.5vw, 14px);
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .card-item-desc {
      color: #6f6f7b;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(11px, 3.2vw, 13px);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .card-contact-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .card-contact {
      display: flex;
      align-items: center;
      min-width: 0;
      color: #6f6f7b;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(11px, 3.2vw, 13px);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .card-contact-icon {
      display: inline-flex;
      flex: 0 0 30px;
      align-items: center;
      justify-content: flex-start;
      min-height: 34px;
      margin-right: 12px;
      padding-right: 12px;
      border-right: 1px solid #dfe2ec;
      color: #8490a4;
    }

    .card-contact-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .card-contact a {
      color: inherit;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .card-contact a:hover,
    .card-contact a:focus-visible {
      color: #2b2c48;
      text-decoration: underline;
    }

    .card-buttons {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      margin-top: auto;
      background-color: #fff;
      box-shadow: 0 -5px 12px rgba(35, 42, 70, 0.035);
    }

    .card-buttons button {
      flex: 1 1 0;
      min-width: 0;
      padding: 13px 4px 12px;
      border: 0;
      border-bottom: 3px solid transparent;
      outline: 0;
      background: none;
      color: #5c5c6d;
      font-family: "Jost", sans-serif;
      font-size: clamp(10px, 3vw, 13px);
      font-weight: 500;
      text-align: center;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .card-buttons button[aria-selected="true"],
    .card-buttons button:hover {
      border-bottom-color: #8a84ff;
      color: #2b2c48;
      background: linear-gradient(to bottom,
          rgba(127, 199, 231, 0) 0%,
          rgba(207, 204, 255, 0.2) 44%,
          rgba(211, 226, 255, 0.4) 100%);
    }

    .card-buttons button:focus-visible,
    .card-social a:focus-visible {
      outline: 2px solid #716bd6;
      outline-offset: 2px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 360px) {
      .card-content {
        padding: 16px;
      }

      .card-social {
        padding-right: 16px;
        padding-left: 16px;
      }

      .card.is-active .card-avatar {
        left: 12px;
        width: 44px;
        height: 44px;
      }

      .card.is-active .card-fullname,
      .card.is-active .card-jobtitle {
        left: 66px;
        right: 8px;
      }

      .card-buttons button {
        padding-right: 2px;
        padding-left: 2px;
        font-size: 10px;
      }
    }

    @media (max-height: 420px) {
      body {
        align-items: flex-start;
      }

      .card {
        margin-top: 4px;
        margin-bottom: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card" data-state="#about" aria-label="Profile card">
    <header class="card-header">
      <div class="card-cover" id="cardCover" aria-hidden="true"></div>
      <img class="card-avatar" id="cardAvatar" alt="Profile photo">
      <h1 class="card-fullname" id="cardName"></h1>
      <h2 class="card-jobtitle" id="cardJobTitle"></h2>
    </header>

    <div class="card-main">
      <section class="card-section is-active" id="about" role="tabpanel" tabindex="0" aria-labelledby="tab-about">
        <div class="card-content">
          <h3 class="card-subtitle" id="aboutTitle"></h3>
          <p class="card-desc" id="aboutContent"></p>
        </div>
        <nav class="card-social" id="socialLinks" aria-label="Social media links"></nav>
      </section>

      <section class="card-section" id="experience" role="tabpanel" tabindex="0" aria-labelledby="tab-experience"
        aria-hidden="true">
        <div class="card-content">
          <h3 class="card-subtitle" id="experienceTitle"></h3>
          <div class="card-timeline" id="timelineContainer"></div>
        </div>
      </section>

      <section class="card-section" id="contact" role="tabpanel" tabindex="0" aria-labelledby="tab-contact"
        aria-hidden="true">
        <div class="card-content">
          <h3 class="card-subtitle" id="contactTitle"></h3>
          <div class="card-contact-wrapper" id="contactContainer"></div>
        </div>
      </section>

      <div class="card-buttons" id="navButtons" role="tablist" aria-label="Profile sections"></div>
    </div>
  </main>

  <script>
    // Edit this object to change the profile card's content.
    const profileDataJson = {
      profile: {
        name: "Ashik David Roy",
        jobTitle: "Computer Science Major",
        coverImage: "https://i.pinimg.com/1200x/d9/b2/97/d9b29715b473dd0a5b37e1bc9929907b.jpg",
        avatar: "https://i.pinimg.com/736x/b2/95/cd/b295cdb0d230c6c92653fe143f0e14e2.jpg"
      },
      sections: {
        about: {
          title: "ABOUT",
          content: "Developer interested in building and maintaining software. Works with common tools and focuses on clear, functional code.",
          social: [
            {name: "GitHub", url: "https://github.com/AshikDavidRoy", icon: "fa-brands fa-github"},
            {name: "X / Twitter", url: "https://x.com/PhantsmDelirium", icon: "fa-brands fa-twitter"},
            {name: "LinkedIn", url: "https://www.linkedin.com/in/ashik-david-roy/", icon: "fa-brands fa-linkedin-in"},
            {name: "LinkedIn", url: "https://codepen.io/Sage-of-Delirium", icon: "fa-brands fa-codepen"}
          ]
        },
        experience: {
          title: "PROJECTS",
          timeline: [
            {title: "vPrompt", description: "AI based prompt searching tool for video footages"},
            {title: "SJCET Labs", description: "A software that assists college faculties to maintain and manage the laboratory."},
            // {title: "Worked at Google", description: "App development"},
            {title: "CodeAtlas", description: "Working on it"}
          ]
        },
        contact: {
          title: "CONTACT",
          info: [
            {type: "location", icon: "fa-solid fa-location-dot", text: "Keralam,India"},
            // {type: "phone", icon: "fa-solid fa-phone", text: "(xxx) xxx-xxxx", link: null},
            {type: "email", icon: "fa-solid fa-envelope", text: "ashikdavidroy2022@gmail.com", link: "mailto:ashikdavidroy2022@gmail.com"}
          ]
        }
      }
    };

    function setText(elementId, value) {
      const element = document.getElementById(elementId);
      if (element) element.textContent = value ?? "";
    }

    function renderProfile() {
      const {profile, sections} = profileDataJson;
      const cover = document.getElementById("cardCover");
      const avatar = document.getElementById("cardAvatar");

      if (cover && profile.coverImage) {
        // The image URL comes from the editable profile data above.
        cover.style.backgroundImage = `url("${profile.coverImage}")`;
      }

      if (avatar) {
        avatar.src = profile.avatar || "";
        avatar.alt = profile.name ? `${profile.name} profile photo` : "Profile photo";
      }

      setText("cardName", profile.name);
      setText("cardJobTitle", profile.jobTitle);

      setText("aboutTitle", sections.about.title);
      setText("aboutContent", sections.about.content);
      renderSocialLinks(sections.about.social);

      setText("experienceTitle", sections.experience.title);
      renderTimeline(sections.experience.timeline);

      setText("contactTitle", sections.contact.title);
      renderContact(sections.contact.info);

      renderNavButtons(sections);
    }

    function renderSocialLinks(socialItems) {
      const container = document.getElementById("socialLinks");
      container.replaceChildren();

      socialItems.forEach((item) => {
        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", item.name);
        link.title = item.name;

        const icon = document.createElement("i");
        icon.className = item.icon;
        icon.setAttribute("aria-hidden", "true");

        link.appendChild(icon);
        container.appendChild(link);
      });
    }

    function renderTimeline(timelineItems) {
      const container = document.getElementById("timelineContainer");
      container.replaceChildren();

      timelineItems.forEach((item) => {
        const timelineItem = document.createElement("article");
        timelineItem.className = "card-item";

        const year = document.createElement("span");
        year.className = "card-item-year";
        year.textContent = item.year;

        const title = document.createElement("h4");
        title.className = "card-item-title";
        title.textContent = item.title;

        const description = document.createElement("div");
        description.className = "card-item-desc";
        description.textContent = item.description;

        timelineItem.append(year, title, description);
        container.appendChild(timelineItem);
      });
    }

    function renderContact(contactItems) {
      const container = document.getElementById("contactContainer");
      container.replaceChildren();

      contactItems.forEach((item) => {
        const contactRow = document.createElement("div");
        contactRow.className = "card-contact";

        const icon = document.createElement("span");
        icon.className = "card-contact-icon";
        icon.setAttribute("aria-hidden", "true");

        const iconElement = document.createElement("i");
        iconElement.className = item.icon;
        icon.appendChild(iconElement);

        const textContainer = document.createElement("span");
        textContainer.className = "card-contact-text";

        if (item.link) {
          const link = document.createElement("a");
          link.href = item.link;
          link.textContent = item.text;
          textContainer.appendChild(link);
        } else {
          textContainer.textContent = item.text;
        }

        contactRow.append(icon, textContainer);
        container.appendChild(contactRow);
      });
    }

    function renderNavButtons(sections) {
      const container = document.getElementById("navButtons");
      container.replaceChildren();

      Object.entries(sections).forEach(([key, section], index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.id = `tab-${key}`;
        button.className = index === 0 ? "is-active" : "";
        button.dataset.section = `#${key}`;
        button.textContent = section.title;
        button.setAttribute("role", "tab");
        button.setAttribute("aria-controls", key);
        button.setAttribute("aria-selected", index === 0 ? "true" : "false");
        button.tabIndex = index === 0 ? 0 : -1;
        container.appendChild(button);
      });
    }

    function setupEventListeners() {
      const navButtons = document.getElementById("navButtons");
      const sections = Array.from(document.querySelectorAll(".card-section"));
      const card = document.querySelector(".card");

      navButtons.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-section]");

        // Ignore clicks that did not originate inside a navigation button.
        if (!button || !navButtons.contains(button)) return;

        const targetSection = button.dataset.section;
        const sectionId = targetSection.slice(1);
        const selectedSection = document.getElementById(sectionId);

        // Guard against invalid or missing section targets.
        if (!selectedSection || !selectedSection.classList.contains("card-section")) return;

        card.dataset.state = targetSection;
        card.classList.toggle("is-active", sectionId !== "about");

        sections.forEach((section) => {
          const isSelected = section === selectedSection;
          section.classList.toggle("is-active", isSelected);
          section.setAttribute("aria-hidden", isSelected ? "false" : "true");
        });

        navButtons.querySelectorAll("button[data-section]").forEach((navButton) => {
          const isSelected = navButton === button;
          navButton.classList.toggle("is-active", isSelected);
          navButton.setAttribute("aria-selected", isSelected ? "true" : "false");
          navButton.tabIndex = isSelected ? 0 : -1;
        });
      });
    }

    // The script is placed after the page markup, so the elements already exist.
    renderProfile();
    setupEventListeners();
  </script>
</body>

</html>
